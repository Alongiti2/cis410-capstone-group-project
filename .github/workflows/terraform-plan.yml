name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: cis410-delphin
  REGION: us-central1
  SERVICE_NAME: cis410-flask-app
  IMAGE: us-central1-docker.pkg.dev/cis410-delphin/cis410-repo/flask-app

jobs:
  build-scan-deploy:
    name: Build Scan Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Snyk SAST scan
        working-directory: app
        run: |
          npm install -g snyk
          snyk auth ${{ secrets.SNYK_TOKEN }}
          snyk test --severity-threshold=critical || true

      - name: Authenticate to GCP via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.SA_EMAIL }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: docker build -t us-central1-docker.pkg.dev/cis410-delphin/cis410-repo/flask-app:${{ github.sha }} ./app

      - name: Snyk container scan
        run: |
          snyk auth ${{ secrets.SNYK_TOKEN }}
          snyk container test us-central1-docker.pkg.dev/cis410-delphin/cis410-repo/flask-app:${{ github.sha }} --severity-threshold=critical || true

      - name: Push to Artifact Registry
        run: docker push us-central1-docker.pkg.dev/cis410-delphin/cis410-repo/flask-app:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy cis410-flask-app \
            --image us-central1-docker.pkg.dev/cis410-delphin/cis410-repo/flask-app:${{ github.sha }} \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --quiet
